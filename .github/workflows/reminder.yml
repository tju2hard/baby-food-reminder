name: 辅食提醒

on:
  workflow_dispatch:  # 仅手动触发（Cloudflare Worker 已接管每日准点定时）

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 运行辅食提醒
        env:
          WEIXIN_SENDKEYS: ${{ secrets.WEIXIN_SENDKEYS }}
          SERVINGS: '2'
          BABIES: '加加、玥玥'
        run: python3 send_reminder_cloud.py
